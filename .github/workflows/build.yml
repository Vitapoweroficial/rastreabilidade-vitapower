name: Build validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc.log

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: tsc.log
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: Verify production workspace flows
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          PROD_URL="https://rastreabilidade-vitapower.vercel.app"
          health="$(curl --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors "$PROD_URL/api/health")"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"stats"'

          lots_health="$(curl --silent --show-error --location "$PROD_URL/api/health?scope=lots" || true)"
          echo "Lot health: $lots_health"
          echo "$lots_health" | grep -q '"ok":true'

          failed=0
          for path in /admin /admin/clientes /admin/produtos /admin/lotes /admin/engenharia /admin/modulos/private-label; do
            code="$(curl --silent --show-error --location --output /tmp/vp-body --write-out '%{http_code}' "$PROD_URL$path" || true)"
            echo "$path -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "Response preview: $(head -c 300 /tmp/vp-body)"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          grep -q 'Vita Power Workspace' /tmp/vp-body || true
          echo "Production workspace flows verified at $PROD_URL"
