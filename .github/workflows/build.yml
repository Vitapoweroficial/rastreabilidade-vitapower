name: Build validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc.log

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: tsc.log
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: Verify production health and dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PROD_URL="https://rastreabilidade-vitapower.vercel.app"
          health="$(curl --fail --silent --show-error --location --retry 18 --retry-delay 5 --retry-all-errors "$PROD_URL/api/health")"
          echo "$health" | grep -q '"ok":true'
          dashboard="$(curl --fail --silent --show-error --location --retry 18 --retry-delay 5 --retry-all-errors "$PROD_URL/admin")"
          echo "$dashboard" | grep -q 'Vita Power Workspace'
          echo "Production verified at $PROD_URL"
