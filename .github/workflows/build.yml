name: Build validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc.log

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: tsc.log
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: Verify production Workspace URL
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "https://rastreabilidade-vitapower.vercel.app"
            "https://rastreabilidade-vitapower-vitapoweroficials-projects.vercel.app"
            "https://rastreabilidade-vitapower-git-main-vitapoweroficials-projects.vercel.app"
          )
          for url in "${candidates[@]}"; do
            echo "Checking $url"
            response="$(curl --connect-timeout 10 --max-time 20 -fsSL "$url/api/health" 2>/dev/null || true)"
            if printf '%s' "$response" | grep -q '"ok":true'; then
              echo "VALIDATED_PRODUCTION_URL=$url"
              echo "HEALTH_RESPONSE=$response"
              exit 0
            fi
          done
          echo "No candidate production URL returned a healthy Workspace response." >&2
          exit 1
