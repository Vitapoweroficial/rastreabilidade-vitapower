name: Build validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc.log

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: tsc.log
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: Verify production workspace flows
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          candidates=(
            "https://rastreabilidade-vitapower.vercel.app"
            "https://rastreabilidade-vitapower-vitapoweroficials-projects.vercel.app"
            "https://rastreabilidade-vitapower-git-main-vitapoweroficials-projects.vercel.app"
          )

          PROD_URL=""
          for candidate in "${candidates[@]}"; do
            body="$(curl --silent --show-error --location --max-time 20 "$candidate/api/health" || true)"
            if echo "$body" | grep -q '"ok":true' && echo "$body" | grep -q '"stats"'; then
              PROD_URL="$candidate"
              break
            fi
          done

          if [ -z "$PROD_URL" ]; then
            echo "No healthy production alias found." >&2
            exit 1
          fi

          dashboard="$(curl --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors "$PROD_URL/admin")"
          echo "$dashboard" | grep -q 'Vita Power Workspace'

          for path in /admin/clientes /admin/produtos /admin/lotes /admin/engenharia /admin/modulos/private-label; do
            curl --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors --output /dev/null "$PROD_URL$path"
          done

          echo "Production workspace flows verified at $PROD_URL"
